
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Football Programs</title>

    <!-- Connect the external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main heading of the webpage -->
    <h1>Top College Football Programs of All Time</h1>

    <!-- Ordered list using CSS class selectors -->
    <ol>
        <li class="crimson">Oklahoma Sooners</li>
        <li class="green-team">Miami Hurricanes</li>
        <li class="maize">Michigan Wolverines</li>
        <li class="red-team">Nebraska Cornhuskers</li>
        <li class="crimson">Alabama Crimson Tide</li>
        <li class="red-team">Ohio State Buckeyes</li>
        <li class="burnt-orange">Texas Longhorns</li>
        <li class="green-team">Notre Dame Fighting Irish</li>
    </ol>

    <!-- Buttons styled with unique CSS IDs -->
    <p>Do you agree with this list?</p>

    <button id="yesButton">Yes</button>
    <button id="noButton">No</button>

</body>
</html>
